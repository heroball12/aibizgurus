{% load static %}<link rel="stylesheet" href="{% static 'css/team-notifications.css' %}"><script src="{% static 'js/team-notifications.js' %}" defer></script>
<div id="teamNotificationCenter" data-user="{{ user.pk }}" data-summary-url="{% url 'staff_message_summary' %}" data-prefs-url="{% url 'staff_notification_preferences' %}" data-read-all-url="{% url 'staff_messages_read_all' %}" data-icon="{% static 'img/ai-business-gurus-logo-nav.png' %}">{% csrf_token %}
<button type="button" id="teamBell" class="team-bell" aria-controls="teamNotificationTray" aria-expanded="false"><span aria-hidden="true">◉</span> Team <b id="teamUnreadBadge" hidden></b></button>
<section id="teamNotificationTray" class="team-notification-tray" aria-label="Team notifications" hidden><header><div><span>STAY IN THE LOOP</span><h2>Your team</h2></div><button type="button" data-notification-settings aria-label="Notification settings">⚙</button><button type="button" id="closeNotificationTray" aria-label="Close notifications">×</button></header><div class="team-tray-tools"><a href="{% url 'staff_messages' %}">Open all conversations ↗</a><button type="button" id="markAllChatRead">Mark all read</button></div><div id="teamNotificationList"><p>Checking messages…</p></div><footer><span id="notificationSyncState" role="status"></span><button type="button" data-notification-settings>Sounds & alerts</button></footer></section>
<a id="teamNotificationToast" class="team-notification-toast" hidden role="status"></a>
<dialog id="teamNotificationSettings" class="team-notification-settings" aria-labelledby="notificationSettingsTitle"><form id="notificationSettingsForm"><header><div><span>YOUR ATTENTION, YOUR CHOICE</span><h2 id="notificationSettingsTitle">Sounds & notifications</h2></div><button type="button" id="closeNotificationSettings" aria-label="Close settings">×</button></header><p>Choose how Teamspace gets your attention while the app is open. Preferences follow your account; desktop permission is set per browser.</p><label for="notificationSound">Notification sound</label><div class="notification-sound-row"><select id="notificationSound" name="sound"><option value="aurora">Aurora · bright, two notes</option><option value="glass">Glass · clear and minimal</option><option value="pulse">Pulse · a gentle signal</option><option value="soft">Soft chime · warm and subtle</option><option value="none">Silent</option></select><button type="button" id="previewNotificationSound">▶ Preview</button></div><label for="notificationVolume">Volume <output id="notificationVolumeValue">40%</output></label><input id="notificationVolume" name="volume" type="range" min="0" max="100" value="40"><label class="notification-check"><input id="notificationDesktop" name="desktop" type="checkbox"><span>Desktop alerts<small>Show a system notification when another chat needs you.</small></span></label><button type="button" id="enableDesktopAlerts">Enable alerts</button><span id="desktopPermissionState" role="status"></span><label class="notification-check"><input id="notificationPreviews" name="previews" type="checkbox" checked><span>Message previews<small>Include message text in pop-up alerts.</small></span></label><label for="notificationSnooze">Do not disturb</label><select id="notificationSnooze" name="snooze"><option value="-1">Keep current setting</option><option value="0">Notifications on</option><option value="15">Pause for 15 minutes</option><option value="60">Pause for 1 hour</option><option value="240">Pause for 4 hours</option><option value="1440">Pause for 24 hours</option></select><p id="notificationSnoozeState"></p><p id="notificationSettingsStatus" role="status"></p><button type="submit" class="notification-save">Save preferences</button></form></dialog></div>
