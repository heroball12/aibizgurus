<dialog class="research-dialog" id="researchDialog" aria-labelledby="researchTitle"><header><div><span class="sales-eyebrow">LEAD FINDER · WEBSITE RESEARCH</span><h2 id="researchTitle">Dig deeper.</h2><p id="researchBusiness"></p></div><button type="button" data-research-close aria-label="Close website research">×</button></header><p id="researchStatus" role="status" aria-live="polite"></p><div id="researchReport"></div><footer><button type="button" class="btn ghost" id="researchRefresh">Scan again</button><button type="button" class="btn neon" data-research-close>Done</button></footer><form hidden id="researchCSRF">{% csrf_token %}</form></dialog>
<dialog class="research-dialog" id="verificationDialog" aria-labelledby="verificationTitle"><header><div><span class="sales-eyebrow">BUSINESS STATUS</span><h2 id="verificationTitle">Still in business?</h2><p id="verificationBusiness"></p></div><button type="button" data-verify-close aria-label="Close verification">×</button></header><p id="verificationStatus" role="status"></p><div id="verificationReport"></div><button type="button" class="btn neon" id="verificationRun">Check public sources</button><details class="sales-advanced"><summary>I verified this business directly</summary><form id="verificationForm" class="form dark-form">{% csrf_token %}<input type="hidden" name="action" value="confirm"><p><label for="verifiedStatus">Operating status</label><select name="status" id="verifiedStatus" required><option value="">Choose the verified outcome</option><option value="confirmed_open">Still operating</option><option value="temporarily_closed">Temporarily closed</option><option value="confirmed_closed">Permanently closed</option></select></p><p><label for="verifiedNote">How did you verify it?</label><textarea id="verifiedNote" name="note" rows="3" minlength="10" maxlength="1000" placeholder="For example: Spoke with the owner today; they confirmed…" required></textarea></p><button class="btn ghost">Save verified outcome</button></form></details><footer><button type="button" class="btn ghost" data-verify-close>Done</button></footer></dialog>
